<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Eight Tones | Saints Peter &amp; Paul</title>
  <meta name="description" content="Follow along with the hymns of the Octoechos (the Eight Tones) at Saints Peter & Paul Greek Orthodox Church, in phonetic Greek, Greek, or English." />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300..700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=GFS+Didot&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
  <style>
    /* ---- Follow along (opened from the bulletin QR code; phone first) ---- */
    .fa-header {
      background: var(--navy-deep);
      padding: 0.75rem 1.25rem;
    }
    .fa-header a {
      display: inline-flex; align-items: center; gap: 0.5rem;
      color: #fff; text-decoration: none;
      font-size: 0.85rem; font-weight: 600;
    }
    .fa-header img { width: 26px; height: 26px; }

    .fa-main { max-width: 760px; margin: 0 auto; padding: 1.75rem 1.25rem 2.5rem; }

    .fa-title { font-size: 2rem; margin: 0 0 0.4rem; }
    .fa-section + .fa-section { margin-top: 3rem; padding-top: 2rem; border-top: 3px solid var(--gold); }
    .fa-intro { font-size: 1rem; line-height: 1.6; color: var(--tx); margin: 0 0 1.25rem; }

    /* Tone tabs: scrollable row of pills on phones, one row of 8 on desktop */
    .fa-tabs {
      display: flex; gap: 0.5rem;
      overflow-x: auto;
      padding: 0.15rem 0.1rem 0.6rem;
      margin: 0 -1.25rem;
      padding-left: 1.25rem; padding-right: 1.25rem;
      scrollbar-width: none;
    }
    .fa-tabs::-webkit-scrollbar { display: none; }
    .fa-tab {
      flex: 0 0 auto;
      min-height: 44px;
      padding: 0 1.1rem;
      border: 1px solid var(--brd);
      border-radius: 999px;
      background: #fff;
      color: var(--navy-deep);
      font: inherit; font-size: 0.95rem; font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .fa-tab:hover { border-color: var(--gold); }
    .fa-tab[aria-selected="true"] {
      background: var(--navy-deep);
      border-color: var(--navy-deep);
      color: #fff;
    }

    /* Segmented switch: Phonetic | Greek | English */
    .fa-switch {
      display: inline-flex;
      margin: 0 0 1.75rem;
      border: 1px solid var(--brd);
      border-radius: 999px;
      background: #fff;
      padding: 3px;
    }
    .fa-switch button {
      min-height: 40px;
      padding: 0 1rem;
      border: 0; border-radius: 999px;
      background: transparent;
      color: var(--navy);
      font: inherit; font-size: 0.9rem; font-weight: 600;
      cursor: pointer;
    }
    .fa-switch button[aria-pressed="true"] { background: var(--gold); color: var(--navy-deep); }

    /* Hymns */
    .fa-panel { max-width: 640px; }
    .fa-hymn + .fa-hymn { margin-top: 2rem; padding-top: 1.75rem; border-top: 1px solid var(--brd); }
    .fa-hymn-label {
      font-family: var(--font-body);
      font-size: 0.75rem; font-weight: 600; letter-spacing: 0.07em;
      text-transform: uppercase; color: var(--gold-text);
      margin: 0 0 0.5rem;
    }
    .fa-hymn-text {
      font-size: 1.15rem; line-height: 1.85; color: var(--navy-deep);
      white-space: pre-line;
      margin: 0;
    }
    .fa-hymn-title {
      font-family: var(--font-heading); font-weight: var(--heading-weight);
      font-size: 1.3rem; color: var(--navy-deep);
      margin: 0 0 0.4rem;
    }
    .fa-hymn-text.is-placeholder { color: var(--mt); font-style: italic; }
    .fa-hymn-note {
      font-size: 0.9rem; color: var(--tx);
      background: var(--gold-lt); border-radius: var(--radius-md);
      padding: 0.6rem 0.85rem; margin: 0 0 1.5rem;
    }
    .fa-hymn-credit { font-size: 0.8rem; color: var(--mt); margin: 0.6rem 0 0; }
    .fa-music-btn { margin-top: 1rem; min-height: 44px; }

    /* Full-screen sheet-music viewer. The overlay scrolls, so the image can be
       pinch-zoomed and panned on phones (nothing blocks zoom). */
    .fa-viewer {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(11, 30, 51, 0.98);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      padding: 3.75rem 0.75rem 1.5rem;
    }
    .fa-viewer[hidden] { display: none; }
    .fa-viewer img {
      display: block;
      width: 100%; max-width: 1400px; height: auto;
      margin: 0 auto;
      background: #fff;
      border-radius: 4px;
    }
    .fa-viewer-bar {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      padding: 0.6rem 0.75rem;
      background: rgba(11, 30, 51, 0.96);
      z-index: 1;
    }
    .fa-viewer-title { color: #fff; font-size: 0.95rem; font-weight: 600; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fa-viewer-actions { display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; }
    .fa-viewer-open { color: var(--gold); font-size: 0.9rem; font-weight: 600; text-decoration: none; }
    .fa-viewer-close {
      width: 44px; height: 44px; border-radius: 50%;
      border: 0; background: rgba(255, 255, 255, 0.12); color: #fff;
      font-size: 1.4rem; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .fa-viewer-close:hover { background: rgba(255, 255, 255, 0.22); }
    @media (min-width: 700px) { .fa-viewer-open { display: none; } }

    .fa-footer {
      border-top: 1px solid var(--brd);
      text-align: center;
      padding: 1.5rem 1.25rem 2rem;
      font-size: 1rem; color: var(--tx);
    }

    @media (min-width: 700px) {
      .fa-main { padding-top: 2.5rem; }
      .fa-title { font-size: 2.4rem; }
      .fa-tabs {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        overflow: visible;
        margin: 0; padding: 0.15rem 0 0.6rem;
      }
      .fa-tab { padding: 0 0.5rem; }
    }
  </style>
</head>
<body>

  <header class="fa-header">
    <a href="{{ '/index.html' | relative_url }}">
      <img src="{{ '/images/logo/sspp-icon.svg' | relative_url }}" alt="">
      Saints Peter &amp; Paul
    </a>
  </header>

  <main class="fa-main" id="main-content">
    <h1 class="sr-only">Follow along with the hymns</h1>

    <div class="fa-switch" role="group" aria-label="Text">
      <button type="button" data-script="phonetic" aria-pressed="true">Phonetic</button>
      <button type="button" data-script="greek" aria-pressed="false">Greek</button>
      <button type="button" data-script="english" aria-pressed="false">English</button>
    </div>

    <section class="fa-section" aria-labelledby="faEverySundayTitle">
      <h2 class="fa-title" id="faEverySundayTitle">Every Sunday</h2>
      <p class="fa-intro">Sung every week, whatever the tone.</p>
      <div class="fa-panel" id="faEverySunday"></div>
    </section>

    <section class="fa-section" aria-labelledby="faTonesTitle">
    <h2 class="fa-title" id="faTonesTitle">The Eight Tones</h2>
    <p class="fa-intro">Follow along with the hymns of the Octoechos. Choose a tone below.</p>

    <div class="fa-tabs" role="tablist" aria-label="Tones">
      <button class="fa-tab" role="tab" id="fa-tab-1" data-tone="1" aria-controls="faPanel" aria-selected="true">Tone 1</button>
      <button class="fa-tab" role="tab" id="fa-tab-2" data-tone="2" aria-controls="faPanel" aria-selected="false" tabindex="-1">Tone 2</button>
      <button class="fa-tab" role="tab" id="fa-tab-3" data-tone="3" aria-controls="faPanel" aria-selected="false" tabindex="-1">Tone 3</button>
      <button class="fa-tab" role="tab" id="fa-tab-4" data-tone="4" aria-controls="faPanel" aria-selected="false" tabindex="-1">Tone 4</button>
      <button class="fa-tab" role="tab" id="fa-tab-5" data-tone="5" aria-controls="faPanel" aria-selected="false" tabindex="-1">Tone 5</button>
      <button class="fa-tab" role="tab" id="fa-tab-6" data-tone="6" aria-controls="faPanel" aria-selected="false" tabindex="-1">Tone 6</button>
      <button class="fa-tab" role="tab" id="fa-tab-7" data-tone="7" aria-controls="faPanel" aria-selected="false" tabindex="-1">Tone 7</button>
      <button class="fa-tab" role="tab" id="fa-tab-8" data-tone="8" aria-controls="faPanel" aria-selected="false" tabindex="-1">Tone 8</button>
    </div>

    <div class="fa-panel" id="faPanel" role="tabpanel" aria-labelledby="fa-tab-1" tabindex="0"></div>
    </section>
  </main>

  <!-- Sheet-music viewer (opened by "View music") -->
  <div class="fa-viewer" id="faViewer" role="dialog" aria-modal="true" aria-labelledby="faViewerTitle" hidden>
    <div class="fa-viewer-bar">
      <p class="fa-viewer-title" id="faViewerTitle"></p>
      <div class="fa-viewer-actions">
        <a class="fa-viewer-open" id="faViewerOpen" href="#" target="_blank" rel="noopener">Open full size</a>
        <button type="button" class="fa-viewer-close" id="faViewerClose" aria-label="Close music">&times;</button>
      </div>
    </div>
    <img id="faViewerImg" src="" alt="">
  </div>

  <footer class="fa-footer">
    Want to sing with us? <a class="text-link" href="{{ '/ministries/choir.html' | relative_url }}">Join the choir</a>
  </footer>

  <script src="js/octoechos-data.js"></script>
  <script>
    (function () {
      const tabs = Array.from(document.querySelectorAll('.fa-tab'));
      const panel = document.getElementById('faPanel');
      const everyPanel = document.getElementById('faEverySunday');
      const switchBtns = Array.from(document.querySelectorAll('.fa-switch button'));
      const STORE_KEY = 'ssppToneScript';
      let tone = 1;
      let script = 'phonetic';

      try {
        const saved = localStorage.getItem(STORE_KEY);
        if (saved === 'phonetic' || saved === 'greek' || saved === 'english') script = saved;
      } catch (e) { /* storage unavailable: use the default */ }

      const esc = (str) => {
        const d = document.createElement('div');
        d.textContent = str || '';
        return d.innerHTML;
      };

      const NAMES = { phonetic: 'Phonetic', greek: 'Greek', english: 'English' };
      const isPlaceholder = (t) => !t || (typeof OCTOECHOS_PLACEHOLDER !== 'undefined' && t === OCTOECHOS_PLACEHOLDER);

      // If the chosen text isn't ready yet, show the English instead
      // (one note at the top of each list says so).
      let usedFallback = false;
      function renderHymn(h, i) {
        let text = h[script];
        let fellBack = false;
        if (isPlaceholder(text) && script !== 'english' && !isPlaceholder(h.english)) {
          text = h.english;
          fellBack = usedFallback = true;
        }
        const placeholder = isPlaceholder(text);
        const lang = script === 'greek' && !fellBack && !placeholder ? ' lang="el"' : '';
        return `
            <section class="fa-hymn">
              <h3 class="fa-hymn-label">${esc(h.label)}</h3>
              ${h.title ? `<p class="fa-hymn-title">${esc(h.title)}</p>` : ''}
              <p class="fa-hymn-text${placeholder ? ' is-placeholder' : ''}"${lang}>${esc(placeholder ? 'Coming soon' : text)}</p>
              ${h.credit ? `<p class="fa-hymn-credit">${esc(h.credit)}</p>` : ''}
              ${h.music ? `<button type="button" class="btn btn-outline-gold fa-music-btn" data-music="${esc(h.music)}" data-title="${esc(h.title || h.label)}">View music</button>` : ''}
            </section>`;
      }

      function renderList(target, hymns) {
        usedFallback = false;
        const body = hymns.map(renderHymn).join('');
        const note = usedFallback
          ? `<p class="fa-hymn-note">${NAMES[script]} texts are coming soon. Showing English for now.</p>`
          : '';
        target.innerHTML = note + body;
      }

      function render() {
        const data = typeof OCTOECHOS !== 'undefined' ? OCTOECHOS : {};
        if (everyPanel) renderList(everyPanel, data.everySunday || []);
        renderList(panel, data[tone] || []);
      }

      // ---- Sheet-music viewer ----
      const viewer = document.getElementById('faViewer');
      const viewerImg = document.getElementById('faViewerImg');
      const viewerTitle = document.getElementById('faViewerTitle');
      const viewerOpen = document.getElementById('faViewerOpen');
      const viewerClose = document.getElementById('faViewerClose');
      let opener = null;

      function openViewer(src, title, btn) {
        opener = btn;
        viewerImg.src = src;
        viewerImg.alt = 'Sheet music: ' + title;
        viewerTitle.textContent = title;
        viewerOpen.href = src;
        viewer.hidden = false;
        viewer.scrollTop = 0;
        document.body.style.overflow = 'hidden';
        viewerClose.focus();
      }
      function closeViewer() {
        if (viewer.hidden) return;
        viewer.hidden = true;
        document.body.style.overflow = '';
        if (opener) opener.focus();
      }
      document.addEventListener('click', (e) => {
        const btn = e.target.closest('.fa-music-btn');
        if (btn) openViewer(btn.dataset.music, btn.dataset.title, btn);
      });
      viewerClose.addEventListener('click', closeViewer);
      // tap outside the music (on the dark overlay) closes it
      viewer.addEventListener('click', (e) => { if (e.target === viewer) closeViewer(); });
      document.addEventListener('keydown', (e) => {
        if (viewer.hidden) return;
        if (e.key === 'Escape') closeViewer();
        // keep Tab inside the viewer
        if (e.key === 'Tab') {
          const items = [viewerOpen, viewerClose].filter((el) => el.offsetParent !== null);
          const first = items[0], last = items[items.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      });

      function selectTone(tab, updateHash) {
        tabs.forEach((t) => {
          const on = t === tab;
          t.setAttribute('aria-selected', on);
          t.tabIndex = on ? 0 : -1;
        });
        tone = Number(tab.dataset.tone);
        panel.setAttribute('aria-labelledby', tab.id);
        tab.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        if (updateHash) history.replaceState(null, '', '#tone-' + tone);
        render();
      }

      function selectScript(value) {
        script = value;
        switchBtns.forEach((b) => b.setAttribute('aria-pressed', b.dataset.script === value));
        try { localStorage.setItem(STORE_KEY, value); } catch (e) { /* ignore */ }
        render();
      }

      tabs.forEach((tab, i) => {
        tab.addEventListener('click', () => selectTone(tab, true));
        tab.addEventListener('keydown', (e) => {
          let next = null;
          if (e.key === 'ArrowRight') next = tabs[(i + 1) % tabs.length];
          else if (e.key === 'ArrowLeft') next = tabs[(i - 1 + tabs.length) % tabs.length];
          else if (e.key === 'Home') next = tabs[0];
          else if (e.key === 'End') next = tabs[tabs.length - 1];
          if (!next) return;
          e.preventDefault();
          selectTone(next, true);
          next.focus();
        });
      });
      switchBtns.forEach((b) => b.addEventListener('click', () => selectScript(b.dataset.script)));

      // #tone-1 … #tone-8 opens that tab; otherwise Tone 1.
      const m = window.location.hash.match(/^#tone-([1-8])$/);
      switchBtns.forEach((b) => b.setAttribute('aria-pressed', b.dataset.script === script));
      selectTone(tabs[m ? Number(m[1]) - 1 : 0], false);
    })();
  </script>
</body>
</html>
